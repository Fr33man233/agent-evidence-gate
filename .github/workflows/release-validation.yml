name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-synthetic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: v0.1.3
      - name: Prepare synthetic evidence binding
        env:
          AEG_INPUT_DIR: ${{ runner.temp }}/aeg-validation
        run: node scripts/prepare-release-validation.mjs "$AEG_INPUT_DIR"
      - name: Run published v0.1.3 action against historical synthetic evidence
        # This workflow intentionally validates the unchanged public v0.1.3 contract.
        # v0.2.0 is not published and must not be tested through the v1 envelope.
        uses: Fr33man233/agent-evidence-gate@d82c7863f48878bfee66e978e7569c464de48ea2
        with:
          manifest: ${{ runner.temp }}/aeg-validation/agent-task.yml
          trace: ${{ runner.temp }}/aeg-validation/agent-trace.jsonl
          evidence: ${{ runner.temp }}/aeg-validation/evidence.json
          repository: ${{ github.workspace }}
          json: gate-report.json
          markdown: gate-report.md
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: aeg-release-validation-report
          path: |
            gate-report.json
            gate-report.md
